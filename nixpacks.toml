[phases.setup]
nixPkgs = ["...", "python311Packages.supervisor"]

[phases.build]

cmds = [
  "mkdir -p /etc/supervisor/conf.d/",
  "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
  "cp /assets/supervisord.conf /etc/supervisord.conf",
  "chmod +x /assets/start.sh",
  "composer install --optimize-autoloader --no-dev",
  "npm install && npm run build",

  # run the patch to force https inside RouteServiceProvider
  "bash /assets/patch_https.sh",
  
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear"
]

[start]
cmd = '/assets/start.sh'

[staticAssets]
"patch_https.sh" = '''
#!/usr/bin/env bash
set -euo pipefail

FILE="app/Providers/RouteServiceProvider.php"

# 1) Ensure the URL facade import exists
if ! grep -q 'use Illuminate\\Support\\Facades\\URL;' "$FILE"; then
  # insert after the namespace line
  sed -i '0,/^namespace App\\Providers;$/s//namespace App\\Providers;\n\nuse Illuminate\\Support\\Facades\\URL;/' "$FILE"
fi

# 2) Ensure a boot() exists that forces https in production
if ! grep -q 'function boot(' "$FILE"; then
  # inject a boot() method right after the class line
  awk '
    /class RouteServiceProvider extends ServiceProvider/ {
      print;
      print "";
      print "    public function boot(): void";
      print "    {";
      print "        if (app()->environment(\"production\")) {";
      print "            URL::forceScheme(\"https\");";
      print "            if (config(\"app.url\")) {";
      print "                URL::forceRootUrl(config(\"app.url\"));";
      print "            }";
      print "        }";
      print "    }";
      next
    }
    { print }
  ' "$FILE" > /tmp/RouteServiceProvider.php && mv /tmp/RouteServiceProvider.php "$FILE"
else
  # boot() exists: make sure it contains URL::forceScheme('https')
  if ! grep -q "URL::forceScheme('https')" "$FILE" && ! grep -q 'URL::forceScheme("https")' "$FILE"; then
    # add the call at the top of boot()
    sed -i "/function boot(.*)/,/{/ s/{/&\n        if (app()->environment('production')) { URL::forceScheme('https'); if (config('app.url')) { URL::forceRootUrl(config('app.url')); } }/" "$FILE"
  fi
fi
'''




"start.sh" = '''
#!/bin/bash
# Run Laravel setup commands
php artisan migrate --force
php artisan config:cache
php artisan route:cache
php artisan view:cache
php artisan storage:link

# Transform the nginx configuration
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Start supervisor
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-queue.conf" = '''
[program:worker-queue]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=4
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-queue.log
stderr_logfile=/var/log/worker-queue.log
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'while true; do php /app/artisan schedule:run; sleep 60; done'
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-scheduler.log
stderr_logfile=/var/log/worker-scheduler.log
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300
php_admin_value[post_max_size] = 100M
php_admin_value[upload_max_filesize] = 100M
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;
    default_type application/octet-stream;

    # New: derive HTTPS for PHP from the forwarded proto sent by Cloudflare
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https   on;
    }

    log_format main '$remote_addr - $remote_user [$time_local] $status '
                    '"$request" $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;
        root /app/public;

        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 100M;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        error_page 404 /index.php;
        
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT  $realpath_root;

            # Make PHP think every request is HTTPS
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;

            # Still forward proxy hints if present (harmless if missing)
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
            fastcgi_param HTTP_CF_VISITOR        $http_cf_visitor;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''

